# BreachAtlas — local development stack (Phase 1: db + backend).
# worker, fetcher, frontend services are added in later phases.
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-breachatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-breachatlas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breachatlas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend
    env_file:
      - .env
    environment:
      # Override host so the backend reaches the db service inside the compose network.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-breachatlas}:${POSTGRES_PASSWORD:-change_me_locally}@db:5432/${POSTGRES_DB:-breachatlas}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
